services:
  omi-local:
    image: omi-local:latest
    build:
      context: ./repo
      dockerfile: omi-host/Dockerfile
    container_name: omi-local
    restart: unless-stopped
    ports:
      # Host-side port is configurable (BACKEND_PORT) for when 8000 is
      # already taken by something else on the host — the container always
      # listens on 8000 internally regardless, so this has no effect on
      # container-to-container traffic (e.g. a cloudflared connector on the
      # same Docker network reaches it at http://omi-local:8000 either way).
      - "${BIND_IP:-0.0.0.0}:${BACKEND_PORT:-8000}:8000"
      - "${BIND_IP:-0.0.0.0}:9099:9099"
      - "127.0.0.1:8085:8085"
    environment:
      PROVIDER_MODE: ${PROVIDER_MODE:-offline}
      # Point Omi at the merge proxy — it auto-discovers models from ALL backends
      OPENAI_BASE_URL: http://omi-proxy:4000/v1
      OPENAI_API_KEY: ${OPENAI_API_KEY:-local}
      # Default models — overridden at runtime by the dashboard model picker (Redis).
      # These must match tagged names from the merge proxy: llama/gemma-4-12b, or/openai/gpt-4o, etc.
      OMI_LOCAL_MODEL: ${OMI_LOCAL_MODEL:-}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      MODULATE_API_KEY: ${MODULATE_API_KEY:-}
      HOSTED_PARAKEET_API_URL: ${HOSTED_PARAKEET_API_URL:-http://omi-audio:8790}
      HOSTED_SPEAKER_EMBEDDING_API_URL: ${HOSTED_SPEAKER_EMBEDDING_API_URL:-http://omi-audio:8790}
      TTS_LOCAL_BASE_URL: ${TTS_LOCAL_BASE_URL:-http://omi-audio:8790}
      PUBLIC_URL: ${PUBLIC_URL:-http://${BIND_IP:-0.0.0.0}:${BACKEND_PORT:-8000}}
      # Local-first infrastructure (self-hosting defaults)
      LOCAL_VECTOR_DB: ${LOCAL_VECTOR_DB:-chroma}
      SEARXNG_URL: ${SEARXNG_URL:-http://omi-searxng:8080}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/data/storage}
      CHROMA_DATA_PATH: ${CHROMA_DATA_PATH:-/data/chroma/vector_db}
      # Only needed for the internet-facing /v1/auth/local-login path (see
      # backend/utils/local_auth.py) — signs this backend's own session
      # tokens for that endpoint. No Firebase/Google involved at all; LAN-only
      # deployments via the Auth emulator (port 9099) don't need this.
      LOCAL_AUTH_JWT_SECRET: ${LOCAL_AUTH_JWT_SECRET:-}
    volumes:
      - omi-data:/data
    depends_on:
      - omi-audio
      - omi-proxy
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  # ── Merge proxy — auto-discovers models from all configured backends ──
  # Every backend in UPSTREAMS gets queried for /v1/models on startup.
  # Set MODEL_ALLOW to curate which models appear (empty = show all).
  #
  # Examples:
  #   MODEL_ALLOW=gemma-4-12b,qwen3-8b                    (llama.cpp only)
  #   MODEL_ALLOW=gemma-4-12b,gpt-4*,claude-sonnet*,gemini*  (llama + OpenRouter)
  #
  # Add/remove models in llama.cpp or OpenRouter — the proxy picks them up.
  # MODEL_ALLOW keeps the dashboard dropdown clean.
  omi-proxy:
    image: omi-proxy:latest
    build:
      context: .
      dockerfile: Dockerfile.proxy
    container_name: omi-proxy
    restart: unless-stopped
    environment:
      UPSTREAMS: ${UPSTREAMS:-{"llama":"http://${LLAMA_HOST:-172.19.0.4}:${LLAMA_PORT:-8081}/v1"}}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-local}
      MODEL_ALLOW: ${MODEL_ALLOW:-}
      MODEL_CACHE_TTL: "60"
      MERGE_PORT: "4000"
      # Shared Redis — allowlist syncs between dashboard and proxy
      REDIS_DB_HOST: ${REDIS_DB_HOST:-redis}
      REDIS_DB_PORT: ${REDIS_DB_PORT:-6380}
      REDIS_DB_PASSWORD: ${REDIS_DB_PASSWORD:-}
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  # Fully-offline audio, both STT and diarization on the MI50 (gfx906) + Piper
  # TTS. Set OMI_ASR_ENGINE=fasterwhisper / OMI_DIA_DEVICE=cpu to fall back to
  # the original CPU-only paths instead.
  omi-audio:
    image: omi-local-audio:latest
    build:
      context: ./repo/omi-host
      dockerfile: Dockerfile.audio
    container_name: omi-audio
    restart: unless-stopped
    ports:
      - "127.0.0.1:8790:8790"
    environment:
      PORT: "8790"
      OMI_ASR_ENGINE: ${OMI_ASR_ENGINE:-whispercpp}
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3-turbo}
      WHISPER_CPP_MODELS_DIR: /data/whispercpp/models
      WHISPER_CPP_SERVER_URL: http://127.0.0.1:8081
      # Unload the ggml model off the GPU after this many idle seconds (0 = never).
      OMI_ASR_IDLE_UNLOAD_S: ${OMI_ASR_IDLE_UNLOAD_S:-300}
      HIP_VISIBLE_DEVICES: "0"
      THREADS: ${THREADS:-8}
      # Diarization (resemblyzer) on the GPU. Set OMI_DIA_DEVICE=cpu to force CPU
      # (e.g. GPU passthrough not working) instead of relying on the auto-fallback.
      OMI_DIA_DEVICE: ${OMI_DIA_DEVICE:-cuda}
      # gfx906 has no bf16 hardware -- fp16 autocast is the real speedup path (see
      # gfx906_runtime_env.sh). MIOpen find-db persists on the shared volume so the
      # one-time kernel benchmarking (FIND_ENFORCE=3) survives container restarts.
      PYTORCH_ROCM_ARCH: gfx906
      MIOPEN_USER_DB_PATH: /data/miopen/gfx906
      MIOPEN_FIND_MODE: "1"
      MIOPEN_FIND_ENFORCE: "3"
      MIOPEN_DEBUG_CONV_WINOGRAD: "1"
      ROCBLAS_LAYER: "0"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      # faster-whisper fallback path only (OMI_ASR_ENGINE=fasterwhisper).
      OMI_ASR_MODEL: ${OMI_ASR_MODEL:-Systran/faster-whisper-small}
      OMI_ASR_COMPUTE: ${OMI_ASR_COMPUTE:-int8}
      OMI_ASR_THREADS: ${OMI_ASR_THREADS:-8}
      OMI_DISABLE_DIA: ${OMI_DISABLE_DIA:-0}
      OMI_PIPER_VOICE: ${OMI_PIPER_VOICE:-/data/piper/voices/en_US-lessac-medium.onnx}
      HF_HOME: /data/hf-cache
    volumes:
      - omi-data:/data
    # ROCm GPU passthrough -- same device/group setup as whispercpp-transcriber.
    devices:
      - /dev/kfd
      - /dev/dri
    # Numeric host group ids that own /dev/dri/renderD128 and /dev/kfd.
    # On Unraid find them with:  getent group render video
    group_add:
      - ${RENDER_GID:-105}
      - ${VIDEO_GID:-44}
    ipc: host
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    shm_size: "2gb"
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  # SearXNG — optional local metasearch engine
  searxng:
    image: searxng/searxng:latest
    container_name: omi-searxng
    profiles:
      - searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8181:8080"
    environment:
      SEARXNG_BASE_URL: ${PUBLIC_URL:-http://localhost:8000}/searxng/
    volumes:
      - searxng-data:/etc/searxng
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

volumes:
  omi-data:
  searxng-data: