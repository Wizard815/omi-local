# Parks the bundled omi-audio container, for the remote-gateway and
# cloud-stt-only recipes (OMI_AUDIO_URL set to another machine, or "off").
# See README.md.
#
# Apply: save as omi-host/docker-compose.override.yml, or, if you already have
# one, add the omi-audio entry below under its `services:`. Then stop the
# running container once:
#   cd omi-host && docker compose up -d && docker compose rm -sf omi-audio
#
# A profile only starts with `--profile bundled-audio`, so a plain
# `docker compose up -d` skips it. omi-local's dependency on it is optional
# (required: false in docker-compose.yml), so the backend still starts.
# Undo: remove this entry and run `docker compose up -d`.

services:
  omi-audio:
    profiles: ["bundled-audio"]
