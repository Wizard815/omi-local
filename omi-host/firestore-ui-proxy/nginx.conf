events {}

http {
    # Only set Connection: upgrade for actual WebSocket requests — setting it
    # unconditionally (a common copy-pasted mistake) breaks HTTP keep-alive
    # for every normal (non-websocket) request through this proxy.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;

        auth_basic "Firestore Emulator UI";
        auth_basic_user_file /etc/nginx/.htpasswd;

        location / {
            proxy_pass http://omi-local:4000;
            proxy_http_version 1.1;
            # The Emulator UI streams live Firestore data over a WebSocket
            # connection — without these headers, the page loads but never
            # shows live updates (and some requests fail outright).
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
        }
    }
}
