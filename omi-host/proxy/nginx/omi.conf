# Omi behind a reverse proxy (REMOTE-ACCESS.md). Mounted as the http-level config of
# the omi-nginx service (compose profiles proxy / tunnel / tailscale); cloudflared or the
# tailscale container talks to it on the Docker network. It is not a TLS endpoint:
# Cloudflare or Tailscale terminates HTTPS in front of it.
#
#   <any hostname>      the backend API, the dashboard at /, and Radicale at /caldav/
#   caldav.<domain>     Radicale at the root, for apps that want their own hostname
#   omi/extra/*.conf    more sites, e.g. Hermes Studio by hostname (extra/studio.conf.example)
#
# Where the upstreams are: omi/upstreams.conf (the demo writes its own).
# Relative paths below resolve against nginx's config directory (/etc/nginx in the image).

include omi/upstreams.conf;

# WebSocket upgrade for /v4/listen and the other socket routes; plain keep-alive otherwise.
map $http_upgrade $omi_connection {
    default upgrade;
    ''      '';
}

# The real caller. cloudflared sends CF-Connecting-IP; it is believed only from the Docker
# networks (cloudflared, tailscale) and loopback, never from a LAN client that can reach
# this port directly. The backend then gets the caller in CF-Connecting-IP / X-Forwarded-For
# (set OMI_TRUSTED_PROXY_NETWORKS to this container's address so its login limiter uses it).
real_ip_header CF-Connecting-IP;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 127.0.0.1;

# HTTPS ended at Cloudflare / Tailscale; keep the scheme they report, else ours.
map $http_x_forwarded_proto $omi_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# A second, cheap brake on password guessing in front of the backend's own limiter.
limit_req_zone $binary_remote_addr zone=omi_login:10m rate=10r/m;

server_tokens off;

server {
    listen 8080 default_server;
    server_name _;

    # Audio sync uploads are up to 200 MB a part (backend/utils/multipart.py); multipart adds a little.
    client_max_body_size 210m;
    client_body_timeout 300s;

    # Chat streams (SSE) and live audio (WebSocket): nothing is held back, nothing times out
    # early. A chat turn on a slow local model may run OMI_LOCAL_LLM_TIMEOUT_SECONDS x 4
    # (1200 s at the default 300 s) plus setup; the server sends a keep-alive every 20 s.
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1300s;
    proxy_send_timeout 1300s;
    add_header X-Accel-Buffering no always;

    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $omi_connection;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $omi_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;

    location / {
        proxy_pass http://omi_backend;
    }

    location = /v1/auth/local-login {
        limit_req zone=omi_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://omi_backend;
    }

    # Radicale (CalDAV/CardDAV) under one hostname: PROPFIND, REPORT, MKCALENDAR and the
    # rest pass through untouched; X-Script-Name makes Radicale write /caldav/ into its hrefs.
    location /caldav/ {
        proxy_pass http://omi_caldav/;
        proxy_set_header X-Script-Name /caldav;
        proxy_set_header Authorization $http_authorization;
    }
    location = /.well-known/caldav { return 301 $omi_forwarded_proto://$host/caldav/; }
    location = /.well-known/carddav { return 301 $omi_forwarded_proto://$host/caldav/; }
}

server {
    listen 8080;
    server_name ~^caldav\.;

    client_max_body_size 20m;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $omi_forwarded_proto;

    location / {
        proxy_pass http://omi_caldav;
    }
}

include omi/extra/*.conf;
