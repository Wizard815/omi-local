# Where omi.conf sends traffic, as the omi-nginx container sees the stack: the backend
# and its bundled Radicale both live in omi-local. "resolve" re-reads Docker's DNS
# (127.0.0.11), so a recreated omi-local (new address) is followed without restarting
# nginx (open-source nginx 1.27.3 and later).
resolver 127.0.0.11 valid=10s ipv6=off;

upstream omi_backend {
    zone omi_backend 64k;
    server omi-local:8000 resolve;
    keepalive 16;
}

upstream omi_caldav {
    zone omi_caldav 64k;
    server omi-local:5232 resolve;
}
